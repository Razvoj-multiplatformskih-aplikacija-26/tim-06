name: staze_workspace
description: Staze, jedan sistem u jednom jeziku. Radni prostor razresava sve pakete i aplikacije zajedno.
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - apps/mobile
  - apps/backoffice
  - apps/server
  - packages/domain
  - packages/use_cases
  - packages/blocs
  - packages/fake_data
  - packages/api_contract
  - packages/api_mapping
  - packages/api_client
  - packages/ui
  - packages/ui_text

dev_dependencies:
  flutter_lints: 6.0.0
