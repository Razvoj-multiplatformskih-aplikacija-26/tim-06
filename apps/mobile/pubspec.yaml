name: mobile
description: Staze, mobilna aplikacija za planinare.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.0+1

environment:
  sdk: ^3.13.5
resolution: workspace


dependencies:
  api_client:
    path: ../../packages/api_client
  blocs:
    path: ../../packages/blocs
  cupertino_icons: ^1.0.8
  domain:
    path: ../../packages/domain
  fake_data:
    path: ../../packages/fake_data
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_secure_storage: 11.2.0
  go_router: 18.0.2
  ui:
    path: ../../packages/ui
  ui_text:
    path: ../../packages/ui_text
  use_cases:
    path: ../../packages/use_cases

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0


flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
