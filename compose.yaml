name: staze

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Prvo kopirajte .env.example u .env}
      POSTGRES_DB: ${POSTGRES_DB:-staze}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-staze}:${POSTGRES_PASSWORD:?Prvo kopirajte .env.example u .env}@db:5432/${POSTGRES_DB:-staze}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
    volumes:
      - ./apps/server/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-staze}:${POSTGRES_PASSWORD:?Prvo kopirajte .env.example u .env}@db:5432/${POSTGRES_DB:-staze}?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Prvo kopirajte .env.example u .env}
      JWT_SECRET: ${JWT_SECRET:?Prvo kopirajte .env.example u .env}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-dev-only-weather-key}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  adminer:
    image: adminer:5
    profiles: [tools]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    depends_on:
      - db

volumes:
  db-data:
